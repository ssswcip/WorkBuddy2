name: 🌱 WorkBuddy Daily

on:
  schedule:
    # 北京时间 07:00 / 12:00 / 23:30（GitHub cron 用 UTC，北京时间 = UTC+8）
    - cron: "0 23 * * *"     # 07:00
    - cron: "0 4 * * *"      # 12:00
    - cron: "30 15 * * *"    # 23:30
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

concurrency:
  group: workbuddy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 国内 + 国际版串行执行，账号多时耗时更长
    env:
      TZ: Asia/Shanghai   # runner 默认 UTC：不加会把日志时间与补签日期算错一天
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Restore benefit guard
        uses: actions/cache@v4
        with:
          path: workbuddy_benefit_state.json
          key: workbuddy-benefit-state-${{ github.run_id }}
          restore-keys: |
            workbuddy-benefit-state-

      # 解密上轮持久化的令牌库（公开仓库中只保存密文，密钥在 secrets.WB_STATE_KEY）
      - name: Decrypt token store
        env:
          WB_STATE_KEY: ${{ secrets.WB_STATE_KEY }}
        run: |
          if [ -z "$WB_STATE_KEY" ]; then
            echo "未配置 WB_STATE_KEY，跳过解密（本轮将从 secret 自举）"
            exit 0
          fi
          for f in wb_refresh_tokens.json wb_intl_tokens.json; do
            if [ -f "$f.enc" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -in "$f.enc" -out "$f" -pass env:WB_STATE_KEY
              echo "已解密 $f.enc -> $f"
            fi
          done

      - name: Detect account config
        id: config
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
        run: |
          if [ -n "$WORKBUDDY_REFRESH_TOKEN" ]; then
            echo "cn=true" >> "$GITHUB_OUTPUT"
          else
            echo "cn=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$WORKBUDDY_INTL_TOKENS" ] || [ -n "$WORKBUDDY_TOKEN" ]; then
            echo "intl=true" >> "$GITHUB_OUTPUT"
          else
            echo "intl=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run WorkBuddy
        if: steps.config.outputs.cn == 'true'
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WORKBUDDY_TASKS: ${{ secrets.WORKBUDDY_TASKS }}
          WORKBUDDY_SKIP_TASKS: ${{ secrets.WORKBUDDY_SKIP_TASKS }}
          WORKBUDDY_MP_GAP: ${{ secrets.WORKBUDDY_MP_GAP }}
          WORKBUDDY_MAKEUP_MAX_PER_RUN: ${{ secrets.WORKBUDDY_MAKEUP_MAX_PER_RUN }}
          WORKBUDDY_ACTIVITY_CHAT_FALLBACK: ${{ secrets.WORKBUDDY_ACTIVITY_CHAT_FALLBACK }}
          WORKBUDDY_NOTIFY: ${{ secrets.WORKBUDDY_NOTIFY }}
        run: python workbuddy_daily.py

      - name: Run WorkBuddy Intl
        if: ${{ always() && steps.config.outputs.intl == 'true' }}
        env:
          WORKBUDDY_INTL_TOKENS: ${{ secrets.WORKBUDDY_INTL_TOKENS }}
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
          WORKBUDDY_INTL_MODELS: ${{ secrets.WORKBUDDY_INTL_MODELS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WORKBUDDY_NOTIFY: ${{ secrets.WORKBUDDY_NOTIFY }}
        run: python workbuddy_intl_daily.py

      - name: No account configured
        if: ${{ always() && steps.config.outputs.cn != 'true' && steps.config.outputs.intl != 'true' }}
        run: echo "::warning::未配置 WORKBUDDY_REFRESH_TOKEN 或 WORKBUDDY_INTL_TOKENS/WORKBUDDY_TOKEN，跳过签到。"

      # 加密持久化：令牌库只以密文（.enc）提交，明文永不落仓库；密钥在 secrets.WB_STATE_KEY
      - name: Persist runtime state (encrypted)
        if: always()
        env:
          WB_STATE_KEY: ${{ secrets.WB_STATE_KEY }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$WB_STATE_KEY" ]; then
            for f in wb_refresh_tokens.json wb_intl_tokens.json; do
              if [ -f "$f" ]; then
                openssl enc -aes-256-cbc -pbkdf2 -in "$f" -out "$f.enc" -pass env:WB_STATE_KEY
                git add -f "$f.enc"
              fi
            done
          else
            echo "::warning::未配置 WB_STATE_KEY，令牌库不持久化，下轮将从 secret 重新自举。"
          fi
          if [ -f workbuddy_benefit_state.json ]; then
            git add -f workbuddy_benefit_state.json
          fi
          if git diff --cached --quiet; then
            echo "运行状态无变化"
          else
            git commit -m "chore: 更新运行状态(加密) [skip ci]"
            git push
          fi
